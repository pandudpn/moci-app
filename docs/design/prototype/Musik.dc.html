.muHitB{animation:muHitB .32s ease-out 1}
.muPadA{animation:muPadA .28s ease-out 1}
.muPadB{animation:muPadB .28s ease-out 1}
.muBob{animation:muBob .9s ease-in-out infinite}
.muIn{animation:muIn .45s cubic-bezier(.3,1.5,.5,1) both}

@keyframes muHitB{0%{transform:translateY(0)}35%{transform:translateY(9px) scale(.98)}100%{transform:translateY(0)}}

@keyframes muPadB{0%{transform:scale(1)}35%{transform:scale(.93)}100%{transform:scale(1)}}
@keyframes muBob{0%,100%{transform:translateY(0)}50%{transform:translateY(10px)}}
@keyframes muIn{0%{transform:scale(.5);opacity:0}100%{transform:scale(1);opacity:1}}

</helmet>

</div>

        x: barX(i), y: barY(i), h: barH(i), col: COL[i][0], dark: COL[i][1], sol: s, num: i + 1,
        aria: T.note + s + ' ' + (i + 1),
        cls: hitCls(i),
        ring: (st.hl === i || next === i) ? ', 0 0 0 7px #FFFFFF, 0 0 0 12px ' + COL[i][1] : '',
        play: () => {
          this.tone(i);
          var s2 = this.state || {};
          var up = { hit: i, hf: !s2.hf };
          var f2 = s2.follow === undefined ? true : !!s2.follow;
          var p2 = s2.follow === undefined ? 2 : (s2.pos || 0);
          var sg = SONGS[s2.song || 'twinkle'];
          if (f2 && sg.n[p2] === i) {
            p2 += 1;
            up.pos = p2; up.follow = true;
            if (p2 >= sg.n.length) {
              up.follow = false; up.cele = true;
              clearTimeout(this._ct);
              this._ct = setTimeout(() => { this.setState({ cele: false }); }, 3500);
              setTimeout(() => this.speak(T.songDone), 700);
            }
          }
          this.setState(up);
        }
      })),
      showNext: next >= 0,
      nextX: next >= 0 ? barX(next) + 28 : 0,
      nextY: next >= 0 ? barY(next) - 54 : 0,
      pads: PADS.map((p, i) => ({
        t: T.pads[i], col: p[1], dark: p[2], icon: p[3],
        cls: st.pad === i ? (st.pf ? 'muPadA' : 'muPadB') : '',
        ring: st.pad === i && st.beating ? ', 0 0 0 7px #FFFFFF, 0 0 0 12px ' + p[2] : '',
        hit: () => { this.drum(p[0]); var s2 = this.state || {}; this.setState({ pad: i, pf: !s2.pf }); }
      })),
      beatLabel: st.beating ? T.beatStop : T.beat,
      beat: () => {
        if (st.beating) { this.stopAll(); this.setState({ beating: false, pad: -1 }); return; }
        this.stopAll();
        this.setState({ beating: true });
        var step = 150;
        for (var loop = 0; loop < 2; loop++) {
          for (var k = 0; k < 16; k++) {
            ((kk, lp) => {
              var hits = [];
              if (kk === 0 || kk === 6 || kk === 8) hits.push(0);
              if (kk === 4 || kk === 12) hits.push(1);
              if (lp === 1 && kk === 14) hits.push(2);
              if (kk % 2 === 0) hits.push(3);
              if (!hits.length) return;
              this._tm.push(setTimeout(() => {
                hits.forEach((h) => this.drum(PADS[h][0]));
                var s2 = this.state || {};
                this.setState({ pad: hits[0], pf: !s2.pf });
              }, (lp * 16 + kk) * step + 100));
            })(k, loop);
          }
        }
        this._tm.push(setTimeout(() => this.setState({ beating: false, pad: -1 }), 32 * step + 500));
      }
    };
  }
}
</script>
