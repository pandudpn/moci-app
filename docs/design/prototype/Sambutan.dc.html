<script type="text/x-dc" data-dc-script data-props='{"lang":{"editor":"enum","options":["auto","id","en"],"default":"auto","section":"Bahasa"},"$preview":{"width":1180,"height":820}}'>
class Component extends DCLogic {
  screens() {
    return ['Main', 'Huruf', 'Tulis', 'Ucapkan', 'Angka', 'AngkaTulis', 'Hewan', 'Buah', 'Warna', 'SukuKata', 'Kata', 'Kalimat', 'Permainan', 'Cocokkan', 'Memori', 'Galeri', 'Mewarnai', 'Hebat', 'Gate', 'OrangTua', 'Bentuk', 'Musik', 'Karyaku', 'Istirahat', 'Bayangan', 'Puzzle', 'Balon', 'BesarKecil'];
  }
  pref(k) {
    var st = this.state || {};
    if (st['p_' + k] !== undefined) return st['p_' + k];
    try { var v = window.localStorage.getItem('moci-' + k); if (v !== null) return v; } catch (e) {}
    return '';
  }
  setPref(k, v) {
    v = v === undefined || v === null ? '' : String(v);
    try { window.localStorage.setItem('moci-' + k, v); } catch (e) {}
    var o = {}; o['p_' + k] = v; this.setState(o);
    try { window.dispatchEvent(new CustomEvent('moci-pref', { detail: { k: k, v: v } })); } catch (e) {}
  }
  L() {
    var p = this.props.lang;
    if (p === 'id' || p === 'en') return p;
    var v = this.pref('lang');
    return v === 'en' ? 'en' : 'id';
  }
  nav(to, params) {
    var scr = to === 'Sambutan' || this.screens().indexOf(to) >= 0 ? to : 'Main';
    this.setState({ scr: scr, params: params || null });
  }
  tick() {
    // play-time tracking for break reminders and the daily limit (Area Orang Tua settings)
    var st = this.state || {};
    var scr = st.scr || 'Splash';
    if (['Splash', 'Sambutan', 'Istirahat', 'Gate', 'OrangTua'].indexOf(scr) >= 0) return;
    this._play = (this._play || 0) + 15000;
    this._brk = (this._brk || 0) + 15000;
    var limit = this.pref('limit');
    if (limit !== '15' && limit !== '45' && limit !== 'off') limit = '30';
    if (limit !== 'off' && this._play >= parseInt(limit, 10) * 60000) { this.nav('Istirahat', { jenis: 'habis' }); return; }
    if (this.pref('breaks') !== 'off' && this._brk >= 20 * 60000) { this._brk = 0; this.nav('Istirahat', { jenis: 'istirahat', back: scr }); }
  }
  componentDidMount() {
    this._onPref = (e) => { var d = e && e.detail; if (d && d.k) { var o = {}; o['p_' + d.k] = d.v; this.setState(o); } };
    this._onStore = (e) => { if (e && e.key && e.key.indexOf('moci-') === 0) { var o = {}; o['p_' + e.key.slice(5)] = e.newValue || ''; this.setState(o); } };

      en: { tag: 'Play & Learn', hi: "Hi! I'm Moci.", sub: 'A play-and-learn buddy for kids aged 2–7.', nameLabel: "Child's name", namePh: "Your little one's nickname", age: "Child's age", years: 'years', note: "Saved only on this device. You can change it in Parents' Corner.", start: "Let's Go!", skip: 'Skip intro', hello: 'Hi', friend: 'friend', say: "Hi! I'm Moci. What's your name?", badges: ['No ads', 'No in-app purchases', 'Works offline'] }
