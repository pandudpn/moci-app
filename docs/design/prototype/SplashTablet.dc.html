<style>
body{margin:0}
.spDrop{animation:spDrop 5s ease-out infinite;transform-origin:50% 100%}
.spBob{animation:spBob 2.4s ease-in-out infinite}
.spPop{display:inline-block;animation:spPop 5s ease-out infinite}
.spFade{animation:spFade 5s ease-out infinite}
.spDot{animation:spDot 1s ease-in-out infinite}
.spCloud{animation-name:spCloud;animation-timing-function:linear;animation-iteration-count:infinite}
.spSpin{animation:spSpin 40s linear infinite;transform-origin:50% 50%}
.spTw{animation:spTw 2.4s ease-in-out infinite}
@keyframes spDrop{0%{transform:translateY(-560px);opacity:1}14%{transform:translateY(0) scale(1.08,.9)}20%{transform:translateY(-34px) scale(.97,1.04)}26%{transform:translateY(0) scale(1)}88%{transform:translateY(0);opacity:1}96%{transform:translateY(0);opacity:0}100%{transform:translateY(-560px);opacity:0}}
@keyframes spBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes spPop{0%,22%{transform:scale(0);opacity:0}30%{transform:scale(1.22);opacity:1}36%{transform:scale(.95)}40%{transform:scale(1)}88%{transform:scale(1);opacity:1}96%,100%{transform:scale(.85);opacity:0}}
@keyframes spFade{0%,38%{transform:translateY(16px);opacity:0}46%{transform:translateY(0);opacity:1}88%{opacity:1}96%,100%{opacity:0}}
@keyframes spDot{0%,60%,100%{transform:translateY(0);opacity:.55}30%{transform:translateY(-12px);opacity:1}}
@keyframes spCloud{from{transform:translateX(-300px)}to{transform:translateX(1500px)}}
@keyframes spSpin{to{transform:rotate(360deg)}}
@keyframes spTw{0%,100%{opacity:.35;transform:scale(.75)}50%{opacity:1;transform:scale(1.1)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
</helmet>

<script type="text/x-dc" data-dc-script data-props='{"tema":{"editor":"enum","options":["terang","gelap"],"default":"terang","section":"Tema"},"$preview":{"width":1180,"height":820}}'>
class Component extends DCLogic {
  renderVals() {
    var dark = (this.props.tema ?? 'terang') === 'gelap';
    return {
      dark: dark,
      light: !dark,
      bg: dark ? 'linear-gradient(180deg, #15112B 0%, #2E2558 70%, #3B2F6E 100%)' : 'linear-gradient(180deg, #74C4FF 0%, #B5E2FF 60%, #DDF3FF 100%)',
      hillBack: dark ? '#3B6D55' : '#A6E38A',
      hillFront: dark ? '#2C5A44' : '#6FCF63',
      cloudOp: dark ? '.10' : '.95',
      pillBg: dark ? '#3A3170' : '#FFFFFF',
      pillFg: dark ? '#F1EDFF' : '#1B4A82',
      dot: dark ? '#FFE066' : '#FFFFFF',
      shadowCol: dark ? 'rgba(0,0,0,.35)' : 'rgba(43,35,80,.22)'
    };
  }
}
</script>
