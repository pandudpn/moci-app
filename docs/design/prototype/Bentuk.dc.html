      isFind: mode === 'find',
      modes: [['learn', T.learn], ['find', T.find]].map((m) => ({
        t: m[1], on: mode === m[0], bg: mode === m[0] ? '#5C7CFA' : '#FFFFFF', fg: mode === m[0] ? '#FFFFFF' : '#2B2350',
        pick: () => {
          clearInterval(this._iv); clearTimeout(this._t);
          if (m[0] === 'find') {
            var r = this.makeRound(0, -1);
            this.setState({ mode: 'find', round: r });
            this.speak(en ? 'Where is the ' + S[r.target][2].toLowerCase() + '?' : 'Mana ' + S[r.target][1].toLowerCase() + '?');
          } else {
            this.setState({ mode: 'learn' });
            this.speak(m[1]);
          }
        }
      })),
      cur: { name: nm(cs), col: cs[3], dark: cs[4], d: cs[5], fx: cs[6], fy: cs[7], fs: cs[8], fact: en ? cs[12] : cs[11] },
      popCls: st.pop === undefined ? '' : (st.pop ? 'btPopA' : 'btPopB'),
      marks: cs[9].slice(0, shown).map((p, i) => ({ x: (p[0] * scale).toFixed(1), y: (p[1] * scale).toFixed(1), n: i + 1 })),
      chips: chips,
      canCount: cs[9].length > 0,
      countLabel: cs[10] === 'star' ? T.countTips : T.count,
      tapShape: () => { var s2 = this.state || {}; this.setState({ pop: !s2.pop }); this.speak(nm(cs)); },
      hear: () => this.speak(nm(cs) + '. ' + (en ? cs[12] : cs[11])),
      count: () => {
        clearInterval(this._iv);
        var k = 0, total = cs[9].length;
        this.setState({ cnt: 0, k: ki });
        this._iv = setInterval(() => {
          k++;
          this.setState({ cnt: k });
          if (k < total) { this.speak(NUM[k - 1]); return; }
          clearInterval(this._iv);
          var unit = cs[10] === 'star' ? T.tips : T.corners;
          this.speak(en ? NUM[k - 1] + '! A ' + cs[2].toLowerCase() + ' has ' + total + ' ' + unit + '!' : NUM[k - 1] + '! ' + cs[1] + ' punya ' + total + ' ' + unit + '!');
        }, 800);
      },
      shapes: S.map((s, i) => ({
        name: nm(s), d: s[5], col: s[3], on: i === ki, fs: nm(s).length > 9 ? 19 : 22,
        bg: i === ki ? '#EEF1FF' : '#FFFFFF', bd: i === ki ? s[4] : '#FFFFFF', sh: i === ki ? s[4] : '#C5CEF7',
        pick: () => { clearInterval(this._iv); var s2 = this.state || {}; this.setState({ k: i, cnt: 0, pop: !s2.pop }); this.speak(nm(s)); }
      })),
      q: q,
      progressLabel: T.progress + ' ' + Math.min(round.score, 6) + ' / 6',
      dots: [0, 1, 2, 3, 4, 5].map((i) => ({ w: i === round.score ? 34 : 16, c: i < round.score ? '#26A03B' : (i === round.score ? '#5C7CFA' : '#D9DFFF') })),
      sayQ: () => this.speak(q),
      done: done,
      again: () => {
        var r = this.makeRound(0, -1);
        this.setState({ round: r });
        this.speak(en ? 'Where is the ' + S[r.target][2].toLowerCase() + '?' : 'Mana ' + S[r.target][1].toLowerCase() + '?');
      },
      opts: round.opts.map((o, i) => {
        var res = round.picked[i];
        var s2 = st;
        return {
          name: nm(S[o.k]), d: S[o.k][5], col: o.col, dark: o.dark, x: o.x, y: o.y, size: o.size, ok: res === 'ok',
          cls: s2.last === i ? (res === 'ok' ? (s2.fl ? 'btOkA' : 'btOkB') : (s2.fl ? 'btNoA' : 'btNoB')) : '',
          pick: () => {
            var cur = this.state || {};
            var r0 = cur.round || this.fixedRound();
            if (r0.score >= 6 || r0.picked[i] === 'ok') return;
            var picked = Object.assign({}, r0.picked);
            if (o.k === r0.target) {
              picked[i] = 'ok';
              this.setState({ round: Object.assign({}, r0, { picked: picked }), last: i, fl: !cur.fl });
              this.speak(T.yes + nm(S[o.k]).toLowerCase() + '!');
              clearTimeout(this._t);
              this._t = setTimeout(() => {
                var c2 = this.state || {};
                var r1 = c2.round || r0;
                var sc = r1.score + 1;
                if (sc >= 6) { this.setState({ round: Object.assign({}, r1, { score: sc }) }); this.speak(T.great); return; }
                var nr = this.makeRound(sc, r1.target);
                this.setState({ round: nr, last: -1 });
                this.speak(en ? 'Where is the ' + S[nr.target][2].toLowerCase() + '?' : 'Mana ' + S[nr.target][1].toLowerCase() + '?');
              }, 1200);
            } else {
              picked[i] = 'no';
              this.setState({ round: Object.assign({}, r0, { picked: picked }), last: i, fl: !cur.fl });
              this.speak(T.no + nm(S[o.k]).toLowerCase() + T.tryAgain);
            }
          }
        };
      })
    };
  }
}
</script>
