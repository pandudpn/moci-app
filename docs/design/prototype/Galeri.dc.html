<x-dc>

<style>

.f{font-family:'Fredoka',ui-rounded,'Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif}
.n{font-family:'Nunito',ui-rounded,system-ui,-apple-system,'Segoe UI',sans-serif}
a{color:#2B2350;text-decoration:none}a:hover{color:#2B2350}
button{font:inherit;color:inherit;border:0;padding:0;margin:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
.tap{transition:transform .12s ease}.tap:active{transform:translateY(5px) scale(.97)}
.glIn{animation:glIn .35s cubic-bezier(.3,1.4,.5,1) both}
.glBob{animation:glBob 3s ease-in-out infinite}
@keyframes glIn{0%{transform:translateY(16px);opacity:0}100%{transform:translateY(0);opacity:1}}
@keyframes glBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

</helmet>
<div class="f" style="position: relative; width: 1180px; height: 820px; overflow: hidden; background-color: #FFF8E1; background-image: radial-gradient(#FFE9A8 3px, transparent 3px); background-size: 36px 36px; color: #2B2350">

<div style="position: absolute; left: 36px; right: 36px; top: 22px; display: flex; align-items: center; gap: 18px">
<a href="{{lk.Main.h}}" onClick="{{lk.Main.go}}" class="tap" aria-label="{{t.back}}" style="width: 76px; height: 76px; border-radius: 26px; background: #FFFFFF; box-shadow: 0 7px 0 #F2D27A; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 24 24" width="38" height="38" fill="none" stroke="#2B2350" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>

<div style="flex: 1"></div>
<div role="group" aria-label="{{t.filter}}" style="display: flex; gap: 6px; padding: 6px; background: #FFFFFF; border-radius: 999px; box-shadow: 0 6px 0 #F2D27A">
<sc-for list="{{tabs}}" as="tb" hint-placeholder-count="3">
<button class="f tap" onClick="{{tb.pick}}" aria-pressed="{{tb.on}}" style="height: 56px; padding: 0 22px; border-radius: 999px; background: {{tb.bg}}; color: {{tb.fg}}; font-size: 22px; font-weight: 600">{{tb.t}}</button>
</sc-for>
</div>
<div class="f" style="display: flex; align-items: center; gap: 8px; height: 64px; padding: 0 22px 0 14px; background: #FFFFFF; border-radius: 999px; box-shadow: 0 6px 0 #F2D27A; font-size: 30px; font-weight: 700">
<svg viewBox="0 0 40 40" width="40" height="40" aria-hidden="true"><path d="M20 3l5.2 10.6 11.7 1.7-8.5 8.2 2 11.6L20 29.6 9.6 35.1l2-11.6-8.5-8.2 11.7-1.7z" fill="#FFC21A" stroke="#F08C00" stroke-width="2" stroke-linejoin="round"/></svg>
<span>24</span>
</div>
</div>

<div style="position: absolute; left: 36px; top: 132px; width: 1108px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 26px 22px">
<sc-for list="{{cards}}" as="c" hint-placeholder-count="15">
<a href="{{c.h}}" onClick="{{c.go}}" class="tap glIn" aria-label="{{c.label}}" style="position: relative; display: block; border-radius: 24px; padding: 10px 10px 8px; background: #FFFFFF; box-shadow: 0 7px 0 {{c.sh}}; text-align: center; animation-delay: {{c.delay}}s">
<div aria-hidden="true" style="position: absolute; left: 50%; top: -11px; width: 74px; height: 24px; margin-left: -37px; border-radius: 4px; background: {{c.tape}}; opacity: .9; transform: rotate({{c.rot}}deg)"></div>
<img src="{{c.t}}" alt="" style="display: block; width: 184px; height: 138px; box-sizing: border-box; border-radius: 14px; border: 2px solid #F1EAD8; background: #FFFFFF; object-fit: contain">
<span class="f" style="display: block; margin-top: 6px; font-size: 20px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.name}}</span>
<span class="n" aria-hidden="true" style="position: absolute; right: -6px; top: 20px; padding: 4px 10px; border-radius: 999px; background: {{c.badgeBg}}; color: #FFFFFF; font-size: 13px; font-weight: 800; display: {{c.badge}}">{{c.badgeT}}</span>
</a>
</sc-for>
</div>

<div class="n" style="position: absolute; left: 36px; bottom: 26px; display: flex; align-items: center; gap: 12px; font-size: 18px; font-weight: 800; color: #6B5F99">
<img class="glBob" src="/_blob/0b224341bbd230f2dd731c560e41d4cb" alt="" style="width: 52px; height: 52px">
<span>{{t.hint}}</span>
</div>

</div>
</x-dc>
