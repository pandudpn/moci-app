            this.setState({ q: { ans: q2.ans, opts: q2.opts, picked: picked }, lastPick: k, flip: !s2.flip });
          }
        };
      }),
      nextQ: () => {
        var q2 = this.quiz();
        var nq = this.makeQ(cat, q2.ans);
        var n2 = (qn % 6) + 1;
        this.setState({ q: nq, qn: n2, lastPick: null });
        this.speak(this.askText(nq.ans).say);
      },
      cards: D.map((it, i) => {
        var nm = en ? it[2] : it[1];
        var isF = it[4] === 'buah';
        return {
          img: '/_blob/' + it[3], name: nm, fs: nm.length > 11 ? 18 : 22, delay: Math.min(i * 0.02, 0.6).toFixed(2),
          bd: st.lk === it[0] ? '#E64980' : '#FFFFFF', sh: isF ? '#F5BCD3' : '#B9E4B5',
          tag: isF ? T.tagF : T.tagV, tagBg: isF ? '#E64980' : '#2F9E44',
          hop: st.lk === it[0] ? (st.hp ? 'bsHop' : 'bsHop2') : '',
          pick: () => { var s2 = this.state || {}; this.setState({ lk: it[0], hp: !s2.hp }); this.speak(nm); }
        };
      })
    };
  }
}
</script>
