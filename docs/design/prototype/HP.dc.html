<script type="text/x-dc" data-dc-script data-props='{"lang":{"editor":"enum","options":["auto","id","en"],"default":"auto","section":"Bahasa"},"$preview":{"width":844,"height":390}}'>
class Component extends DCLogic {
  pref(k) {
    var st = this.state || {};
    if (st['p_' + k] !== undefined) return st['p_' + k];
    try { var v = window.localStorage.getItem('moci-' + k); if (v !== null) return v; } catch (e) {}
    return '';
  }
  setPref(k, v) {
    try { window.localStorage.setItem('moci-' + k, v); } catch (e) {}
    var o = {}; o['p_' + k] = v; this.setState(o);
    try { window.dispatchEvent(new CustomEvent('moci-pref', { detail: { k: k, v: v } })); } catch (e) {}
  }
  L() {
    var p = this.props.lang;
    if (p === 'id' || p === 'en') return p;
    return this.pref('lang') === 'en' ? 'en' : 'id';
  }
  componentDidMount() {
    this._onPref = (e) => { var d = e && e.detail; if (d && d.k) { var o = {}; o['p_' + d.k] = d.v; this.setState(o); } };
    this._onStore = (e) => { if (e && e.key && e.key.indexOf('moci-') === 0) { var o = {}; o['p_' + e.key.slice(5)] = e.newValue || ''; this.setState(o); } };
    try { window.addEventListener('moci-pref', this._onPref); window.addEventListener('storage', this._onStore); } catch (e) {}
  }
  componentWillUnmount() {
    clearTimeout(this._t); clearTimeout(this._t2);
    try { window.removeEventListener('moci-pref', this._onPref); window.removeEventListener('storage', this._onStore); } catch (e) {}
  }
  speak(t, lang) {
    try {
      var s = window.speechSynthesis;
      if (!s || typeof SpeechSynthesisUtterance === 'undefined') return;
      s.cancel();
      var u = new SpeechSynthesisUtterance(t);
      var en = (lang || this.L()) === 'en';
      u.lang = en ? 'en-US' : 'id-ID'; u.rate = 0.9; u.pitch = 1.15;
      var re = en ? /^en/i : /^id/i;
      var vs = s.getVoices ? s.getVoices() : [];
      for (var i = 0; i < vs.length; i++) { if (re.test(vs[i].lang)) { u.voice = vs[i]; break; } }
      s.speak(u);
    } catch (e) {}
  }
  renderVals() {
    var lang = this.L();
    var st = this.state || {};
    var nm = String(this.pref('name') || '').trim();
    var T = {
      id: {
        parents: 'Orang Tua', langLabel: 'Bahasa', starsLabel: '24 bintang', mociLabel: 'Moci, ketuk untuk menyapa',
        hi: 'Hai, ' + (nm || 'Adik') + '!', cont: 'Lanjutkan', contSub: 'Tulis huruf A',
        say: 'Hai' + (nm ? ', ' + nm : '') + '! Aku Moci. Mau main apa hari ini?',
        tiles: { huruf: 'Kenal Huruf', angka: 'Berhitung', hewan: 'Dunia Hewan', buah: 'Buah & Sayur', baca: 'Ayo Membaca', main: 'Main Yuk!', warnai: 'Mewarnai', warna: 'Warna', bentuk: 'Bentuk', musik: 'Main Musik' }
      },
      en: {
        parents: 'Parents', langLabel: 'Language', starsLabel: '24 stars', mociLabel: 'Moci, tap to say hi',
        hi: 'Hi, ' + (nm || 'little one') + '!', cont: 'Continue', contSub: 'Write letter A',
        say: 'Hi' + (nm ? ', ' + nm : '') + "! I'm Moci. What shall we play today?",

      }
    }[lang];
    var tl = {};
    var say = {};
    Object.keys(T.tiles).forEach((k) => {
      var v = T.tiles[k];
      tl[k] = { t: v, fs: v.length > 12 ? 15 : 17 };
      say[k] = () => this.speak(v);
    });
    return {
      t: T,
      tl: tl,
      say: say,
      isId: lang === 'id',
      isEn: lang === 'en',
      idBg: lang === 'id' ? '#E8384F' : '#FFFFFF',
      idFg: lang === 'id' ? '#FFFFFF' : '#2B2350',
      enBg: lang === 'en' ? '#1C7ED6' : '#FFFFFF',
      enFg: lang === 'en' ? '#FFFFFF' : '#2B2350',
      toId: () => { this.setPref('lang', 'id'); this.speak('Bahasa Indonesia', 'id'); },
      toEn: () => { this.setPref('lang', 'en'); this.speak('English', 'en'); },
      mociClass: st.hop ? 'hop' : '',

        this.speak(T.say);

        this._t2 = setTimeout(() => {
          this.setState({ hop: true });
          this._t = setTimeout(() => this.setState({ hop: false }), 850);
        }, 30);
      }
    };
  }
