      sayMain: () => this.speak(byName ? cur.u : cur.snd),
      saySound: () => this.speak(cur.snd),
      sayName: () => this.speak(cur.u),
      sayWord: () => this.speak(w),
      sayAll: () => this.speak(this.chant(cur)),
      prev: () => this.go(idx - 1),
      next: () => this.go(idx + 1),
      alpha: D.map((d, i) => ({
        u: d.u,
        label: T.letter + ' ' + d.u,
        bg: i === idx ? '#E8384F' : '#FFFFFF',
        fg: i === idx ? '#FFFFFF' : '#2B2350',
        sh: i === idx ? '#B82A3E' : '#F3C2B3',
        pick: () => this.go(i)
      }))
    };
  }
}
</script>
