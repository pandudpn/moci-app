<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Moci · Kartu Memori</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&amp;family=Nunito:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.f{font-family:'Fredoka',ui-rounded,'Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif}
.n{font-family:'Nunito',ui-rounded,system-ui,-apple-system,'Segoe UI',sans-serif}
a{color:#2B2350;text-decoration:none}a:hover{color:#2B2350}
button{font:inherit;color:inherit;border:0;padding:0;margin:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
.tap{transition:transform .12s ease}.tap:active{transform:translateY(5px) scale(.97)}
.mmFlip{transition:transform .45s cubic-bezier(.3,1.3,.5,1);transform-style:preserve-3d;-webkit-transform-style:preserve-3d}
.mmFace{backface-visibility:hidden;-webkit-backface-visibility:hidden}
.mmTw{animation:mmTw 2.4s ease-in-out infinite}
.mmRise{animation:mmRise .45s cubic-bezier(.3,1.5,.5,1) both}
.mmIn{animation:mmIn .4s cubic-bezier(.3,1.5,.5,1) both}
.mmGot{animation:mmGot .6s cubic-bezier(.3,1.6,.5,1) 1}
@keyframes mmTw{0%,100%{opacity:.6;transform:scale(.9)}50%{opacity:1;transform:scale(1.08)}}
@keyframes mmRise{0%{transform:translateY(30px);opacity:0}100%{transform:translateY(0);opacity:1}}
@keyframes mmIn{0%{transform:scale(.5);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes mmGot{0%{transform:scale(1)}40%{transform:scale(1.12)}100%{transform:scale(1)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div class="f" style="position: relative; width: 1180px; height: 820px; overflow: hidden; background-color: #EAF2FF; background-image: radial-gradient(#D3E3FF 3px, transparent 3px); background-size: 36px 36px; color: #2B2350">

<div style="position: absolute; left: 32px; right: 32px; top: 22px; display: flex; align-items: center; gap: 14px">
<a href="{{lk.Permainan.h}}" onClick="{{lk.Permainan.go}}" class="tap" aria-label="{{t.back}}" style="width: 76px; height: 76px; border-radius: 26px; background: #FFFFFF; box-shadow: 0 7px 0 #B7D0F7; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 24 24" width="38" height="38" fill="none" stroke="#2B2350" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
</a>
<h1 class="f" style="margin: 0; font-size: 44px; font-weight: 700; white-space: nowrap">{{t.title}}</h1>
<div style="flex: 1"></div>
<div role="group" aria-label="{{t.level}}" style="display: flex; gap: 6px; padding: 6px; background: #FFFFFF; border-radius: 999px; box-shadow: 0 6px 0 #B7D0F7">
<sc-for list="{{levels}}" as="lv" hint-placeholder-count="3">
<button class="f tap" onClick="{{lv.pick}}" aria-pressed="{{lv.on}}" style="height: 52px; padding: 0 16px; border-radius: 999px; background: {{lv.bg}}; color: {{lv.fg}}; font-size: 20px; font-weight: 600; white-space: nowrap">{{lv.t}}</button>
</sc-for>
</div>
<div class="f" role="status" style="display: flex; align-items: center; height: 60px; padding: 0 20px; background: #FFFFFF; border-radius: 999px; box-shadow: 0 6px 0 #B7D0F7; font-size: 22px; font-weight: 600; white-space: nowrap">{{movesLabel}}</div>
<button class="f tap" onClick="{{restart}}" style="display: flex; align-items: center; gap: 8px; height: 60px; padding: 0 18px; background: #FFFFFF; border-radius: 999px; box-shadow: 0 6px 0 #B7D0F7; font-size: 21px; font-weight: 600">
<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.6-5.9"/><path d="M4 4v5h5"/></svg>
<span>{{t.restart}}</span>
</button>
</div>

<div style="position: absolute; left: 32px; right: 32px; top: 116px; display: flex; align-items: center; justify-content: center; gap: 8px">
<span class="n" style="font-size: 17px; font-weight: 800; color: #3B5BDB; margin-right: 4px">{{t.theme}}</span>
<sc-for list="{{themes}}" as="th" hint-placeholder-count="6">
<button class="f tap" onClick="{{th.pick}}" aria-pressed="{{th.on}}" style="height: 48px; padding: 0 16px; border-radius: 999px; background: {{th.bg}}; color: {{th.fg}}; box-shadow: 0 4px 0 {{th.sh}}; font-size: 18px; font-weight: 600; white-space: nowrap">{{th.t}}</button>
</sc-for>
</div>

<div style="position: absolute; left: 50%; top: {{grid.top}}px; width: {{grid.w}}px; margin-left: {{grid.ml}}px; display: grid; grid-template-columns: repeat({{grid.cols}}, minmax(0, 1fr)); gap: {{grid.gap}}px">
<sc-for list="{{cards}}" as="c" hint-placeholder-count="12">
<button class="tap {{c.anim}}" onClick="{{c.tap}}" aria-label="{{c.aria}}" style="position: relative; height: {{grid.h}}px; perspective: 900px; animation-delay: {{c.delay}}s">
<div class="mmFlip" style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; transform: {{c.rot}}">
<div class="mmFace" style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; box-sizing: border-box; border-radius: 26px; background: {{c.back}}; border: 6px solid #FFFFFF; box-shadow: 0 8px 0 {{c.backSh}}; display: flex; align-items: center; justify-content: center">
<svg class="mmTw" viewBox="0 0 40 40" width="{{grid.star}}" height="{{grid.star}}" aria-hidden="true"><path d="M20 3l5.2 10.6 11.7 1.7-8.5 8.2 2 11.6L20 29.6 9.6 35.1l2-11.6-8.5-8.2 11.7-1.7z" fill="#FFFFFF"/></svg>
<span aria-hidden="true" style="position: absolute; left: 14px; top: 14px; width: 12px; height: 12px; border-radius: 50%; background: rgba(255,255,255,.55)"></span>
<span aria-hidden="true" style="position: absolute; right: 16px; bottom: 16px; width: 16px; height: 16px; border-radius: 50%; background: rgba(255,255,255,.45)"></span>
</div>
<div class="mmFace" style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; box-sizing: border-box; border-radius: 26px; background: #FFFFFF; border: 6px solid {{c.bd}}; box-shadow: 0 8px 0 {{c.sh}}; transform: rotateY(180deg); display: flex; align-items: center; justify-content: center">
<img class="{{c.got}}" src="{{c.img}}" alt="" draggable="false" style="width: {{grid.img}}px; height: {{grid.img}}px">
</div>
</div>
</button>
</sc-for>
</div>

<sc-if value="{{allDone}}" hint-placeholder-val="{{false}}">
<div class="mmRise" style="position: absolute; left: 50%; top: 360px; margin-left: -300px; width: 600px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 28px 34px; border-radius: 40px; background: #FFFFFF; box-shadow: 0 12px 0 #B7D0F7, 0 30px 60px rgba(43,35,80,.25)">
<div class="f" style="font-size: 38px; font-weight: 700; color: #3B5BDB; text-align: center">{{t.done}}</div>
<div class="n" style="font-size: 19px; font-weight: 800; color: #6B5F99">{{doneSub}}</div>
<div style="display: flex; gap: 14px">
<button class="f tap" onClick="{{restart}}" style="height: 64px; padding: 0 24px; border-radius: 999px; background: #EAF2FF; box-shadow: 0 5px 0 #B7D0F7; color: #2B2350; font-size: 24px; font-weight: 600">{{t.again}}</button>
<a href="{{lk.Hebat.h}}" onClick="{{lk.Hebat.go}}" class="f tap" style="height: 64px; padding: 0 24px; border-radius: 999px; background: #3B5BDB; box-shadow: 0 5px 0 #2B44B0; color: #FFFFFF; font-size: 24px; font-weight: 600; display: flex; align-items: center">{{t.prize}}</a>
</div>
</div>
</sc-if>

</div>
</x-dc>

    var lay = this.layout(g.n);
    var palette = ['#22C1C3', '#FF8A3D', '#9775FA', '#3BA4FF', '#FF6B6B'];
    var backC = { buah: ['#FF6B6B', '#E04848'], hewan: ['#22C1C3', '#129A9C'], sayur: ['#5FD068', '#3BAA45'], kendaraan: ['#3BA4FF', '#1C7ED6'], benda: ['#9775FA', '#7048E8'] }[g.theme] || ['#22C1C3', '#129A9C'];
    var allDone = Object.keys(g.got).length >= g.n && !g.fresh;
    return {
      t: T,
      lk: this.lk(['Permainan', 'Hebat']),
      grid: lay,
      movesLabel: T.moves + ': ' + g.moves,
      doneSub: T.doneSub + g.moves,
      allDone: allDone,
      levels: [4, 6, 8].map((n) => ({
        t: n + T.pairs, on: g.n === n,
        bg: g.n === n ? '#3B5BDB' : '#FFFFFF', fg: g.n === n ? '#FFFFFF' : '#2B2350',
        pick: () => { clearTimeout(this._ct); this.setState({ g: this.makeGame(g.pick === 'acak' ? null : g.pick, n, g.theme) }); }
      })),
      themes: ['acak', 'buah', 'hewan', 'sayur', 'kendaraan', 'benda'].map((k) => {
        var on = g.pick === k && !g.fresh;
        return {
          t: names[k], on: on, bg: on ? '#3B5BDB' : '#FFFFFF', fg: on ? '#FFFFFF' : '#2B2350', sh: on ? '#2B44B0' : '#B7D0F7',
          pick: () => { clearTimeout(this._ct); var g2 = this.makeGame(k === 'acak' ? null : k, g.n, g.theme); this.setState({ g: g2 }); this.speak(names[g2.theme]); }
        };
      }),
      restart: () => { clearTimeout(this._ct); var g2 = this.makeGame(g.pick === 'acak' ? null : g.pick, g.n, g.theme); this.setState({ g: g2 }); this.speak(names[g2.theme]); },
      cards: g.deck.map((k, i) => {
        var it = this.find(k);
        var up = g.got[k] || g.open.indexOf(i) >= 0;
        var name = it ? (en ? it[2] : it[1]) : k;
        var ci = Object.keys(g.got).indexOf(k);
        return {
          img: '/_blob/' + (it ? it[3] : ''),
          rot: up ? 'rotateY(180deg)' : 'rotateY(0deg)',
          aria: up ? name : T.hidden,
          anim: g.fresh ? '' : 'mmIn',
          delay: (i * 0.03).toFixed(2),
          got: g.got[k] && st.last === k ? 'mmGot' : '',
          back: backC[0], backSh: backC[1],
          bd: g.got[k] ? palette[ci % palette.length] : '#D3E3FF',
          sh: g.got[k] ? '#B7D0F7' : '#C5D8F5',
          tap: () => {
            var g2 = this.game();
            if (g2.got[k] || g2.open.indexOf(i) >= 0 || g2.open.length >= 2) return;
            var open = g2.open.concat([i]);
            this.speak(name);
            if (open.length < 2) { this.setState({ g: Object.assign({}, g2, { open: open, fresh: false }) }); return; }
            var a = g2.deck[open[0]], b = g2.deck[open[1]];
            var moves = g2.moves + 1;
            if (a === b) {
              var got = Object.assign({}, g2.got); got[a] = true;
              var done = Object.keys(got).length >= g2.n;
              this.setState({ g: Object.assign({}, g2, { open: [], got: got, moves: moves, fresh: false }), last: a });
              this.speak(done ? T.doneSay : name + T.pair);
            } else {
              this.setState({ g: Object.assign({}, g2, { open: open, moves: moves, fresh: false }) });
              clearTimeout(this._ct);
              this._ct = setTimeout(() => { var g3 = this.game(); this.setState({ g: Object.assign({}, g3, { open: [] }) }); }, 950);
            }
          }
        };
      })
    };
  }
}
</script>
