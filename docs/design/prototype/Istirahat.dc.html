<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Moci · Waktunya Istirahat</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&amp;family=Nunito:wght@600;700;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.f{font-family:'Fredoka',ui-rounded,'Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif}
.n{font-family:'Nunito',ui-rounded,system-ui,-apple-system,'Segoe UI',sans-serif}
a{color:#2B2350;text-decoration:none}a:hover{color:#2B2350}
button{font:inherit;color:inherit;border:0;padding:0;margin:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
.tap{transition:transform .12s ease}.tap:active{transform:translateY(5px) scale(.97)}
.isTw{animation:isTw 2.6s ease-in-out infinite}
.isZ{animation:isZ 3s ease-in-out infinite}
.isFloat{animation:isFloat 5s ease-in-out infinite}
.isIn{animation:isIn .5s cubic-bezier(.3,1.5,.5,1) both}
@keyframes isTw{0%,100%{opacity:.3;transform:scale(.75)}50%{opacity:1;transform:scale(1.1)}}
@keyframes isZ{0%{transform:translate(0,0) scale(.6);opacity:0}25%{opacity:1}100%{transform:translate(26px,-90px) scale(1.15);opacity:0}}
@keyframes isFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes isIn{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div class="f" style="position: relative; width: 1180px; height: 820px; overflow: hidden; background: linear-gradient(180deg, #241D4A 0%, #3E3180 55%, #7C6BD6 100%); color: #FFFFFF">

<svg aria-hidden="true" viewBox="0 0 120 120" width="120" height="120" style="position: absolute; left: 70px; top: 50px"><defs><mask id="isMoon"><rect width="120" height="120" fill="#FFFFFF"/><circle cx="80" cy="44" r="42" fill="#000000"/></mask></defs><circle cx="56" cy="62" r="46" fill="#FFE88A" mask="url(#isMoon)"/></svg>
<svg class="isTw" aria-hidden="true" viewBox="0 0 24 24" width="24" height="24" style="position: absolute; left: 270px; top: 70px"><path d="M12 0l3 9 9 3-9 3-3 9-3-9-9-3 9-3z" fill="#FFE066"/></svg>
<svg class="isTw" aria-hidden="true" viewBox="0 0 24 24" width="16" height="16" style="position: absolute; left: 420px; top: 150px; animation-delay: .7s"><path d="M12 0l3 9 9 3-9 3-3 9-3-9-9-3 9-3z" fill="#FFFFFF"/></svg>
<svg class="isTw" aria-hidden="true" viewBox="0 0 24 24" width="14" height="14" style="position: absolute; left: 180px; top: 230px; animation-delay: 1.4s"><path d="M12 0l3 9 9 3-9 3-3 9-3-9-9-3 9-3z" fill="#FFFFFF"/></svg>
<svg class="isTw" aria-hidden="true" viewBox="0 0 24 24" width="20" height="20" style="position: absolute; left: 520px; top: 60px; animation-delay: 2s"><path d="M12 0l3 9 9 3-9 3-3 9-3-9-9-3 9-3z" fill="#FFFFFF"/></svg>
<svg class="isTw" aria-hidden="true" viewBox="0 0 24 24" width="12" height="12" style="position: absolute; left: 1080px; top: 120px; animation-delay: .4s"><path d="M12 0l3 9 9 3-9 3-3 9-3-9-9-3 9-3z" fill="#FFFFFF"/></svg>
<svg class="isTw" aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" style="position: absolute; left: 980px; top: 700px; animation-delay: 1.1s"><path d="M12 0l3 9 9 3-9 3-3 9-3-9-9-3 9-3z" fill="#FFE066"/></svg>

<a href="{{lk.Gate.h}}" onClick="{{lk.Gate.go}}" class="n tap" style="position: absolute; right: 32px; top: 26px; height: 58px; padding: 0 20px; border-radius: 999px; background: rgba(255,255,255,.14); box-shadow: inset 0 0 0 2px rgba(255,255,255,.3); color: #FFFFFF; font-size: 18px; font-weight: 800; display: flex; align-items: center; gap: 8px">
<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4.5" y="10.5" width="15" height="10" rx="2.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg>
<span>{{t.parents}}</span>
</a>

<div class="isFloat" aria-hidden="true" style="position: absolute; left: 60px; top: 300px; width: 520px; height: 460px">
<svg viewBox="0 0 520 220" width="520" height="220" style="position: absolute; left: 0; top: 240px"><path d="M92 210C40 210 22 160 62 140C52 92 108 66 150 88C166 40 238 30 266 76C296 44 360 52 372 100C420 86 466 118 458 160C500 166 506 210 470 210Z" fill="#FFFFFF"/><path d="M92 210C40 210 22 160 62 140C70 168 110 180 150 176C200 196 300 196 360 178C410 186 450 176 458 160C500 166 506 210 470 210Z" fill="#E6E0FF"/></svg>
<svg viewBox="0 0 240 240" width="300" height="300" style="position: absolute; left: 110px; top: 6px">
<defs><clipPath id="isBody"><path d="M120 52C178 52 212 104 212 152C212 196 172 218 120 218C68 218 28 196 28 152C28 104 62 52 120 52Z"/></clipPath></defs>
<ellipse cx="44" cy="176" rx="16" ry="26" transform="rotate(60 44 176)" fill="#F5B700"/>
<ellipse cx="196" cy="176" rx="16" ry="26" transform="rotate(-60 196 176)" fill="#F5B700"/>
<path d="M120 52C178 52 212 104 212 152C212 196 172 218 120 218C68 218 28 196 28 152C28 104 62 52 120 52Z" fill="#FFD43B"/>
<g clip-path="url(#isBody)"><ellipse cx="160" cy="204" rx="112" ry="58" fill="#F5B700" opacity=".45"/></g>
<ellipse cx="120" cy="174" rx="52" ry="36" fill="#FFF1B0"/>
<ellipse cx="78" cy="92" rx="16" ry="9" transform="rotate(-35 78 92)" fill="#FFFFFF" opacity=".75"/>
<path d="M120 54C120 44 118 36 112 30" stroke="#2F9E44" stroke-width="5" stroke-linecap="round" fill="none"/>
<path d="M114 34C100 18 78 20 72 30C84 42 104 44 114 34Z" fill="#51CF66"/>
<path d="M112 32C114 12 134 2 144 8C142 26 126 36 112 32Z" fill="#69DB7C"/>
<path d="M83 124Q94 133 105 124" stroke="#2B2350" stroke-width="6" stroke-linecap="round" fill="none"/>
<path d="M135 124Q146 133 157 124" stroke="#2B2350" stroke-width="6" stroke-linecap="round" fill="none"/>
<ellipse cx="72" cy="146" rx="13" ry="8" fill="#FF8FA3" opacity=".8"/>
<ellipse cx="168" cy="146" rx="13" ry="8" fill="#FF8FA3" opacity=".8"/>
<path d="M110 142C115 137 125 137 130 142C127 149 113 149 110 142Z" fill="#FF8A3D"/>
</svg>
<span class="isZ f" style="position: absolute; left: 360px; top: 40px; font-size: 40px; font-weight: 700; color: #FFFFFF">Z</span>
<span class="isZ f" style="position: absolute; left: 380px; top: 40px; font-size: 32px; font-weight: 700; color: #FFFFFF; animation-delay: 1s">z</span>
<span class="isZ f" style="position: absolute; left: 400px; top: 40px; font-size: 26px; font-weight: 700; color: #FFFFFF; animation-delay: 2s">z</span>
</div>

<div style="position: absolute; left: 620px; top: 150px; width: 500px; display: flex; flex-direction: column; gap: 16px">
<h1 class="f" style="margin: 0; font-size: 50px; font-weight: 700; line-height: 1.1">{{title}}</h1>
<p class="n" style="margin: 0; font-size: 23px; font-weight: 800; line-height: 1.4; color: #E5DEFF">{{sub}}</p>

<sc-if value="{{counting}}" hint-placeholder-val="{{true}}">
<div style="margin-top: 10px; display: flex; align-items: center; gap: 26px">
<div role="timer" aria-label="{{timerLabel}}" style="position: relative; width: 150px; height: 150px; flex: none">
<svg viewBox="0 0 150 150" width="150" height="150" aria-hidden="true">
<circle cx="75" cy="75" r="62" fill="none" stroke="rgba(255,255,255,.2)" stroke-width="14"/>
<circle cx="75" cy="75" r="62" fill="none" stroke="#FFD43B" stroke-width="14" stroke-linecap="round" stroke-dasharray="389.6" stroke-dashoffset="{{ringOff}}" transform="rotate(-90 75 75)"/>
</svg>
<div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center">
<span class="f" style="font-size: 54px; font-weight: 700; line-height: 1">{{left}}</span>
<span class="n" style="font-size: 15px; font-weight: 800; color: #E5DEFF">{{t.secs}}</span>
</div>
</div>
<div style="flex: 1; display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{steps}}" as="s" hint-placeholder-count="3">
<div style="height: 60px; box-sizing: border-box; padding: 0 16px 0 8px; border-radius: 20px; background: {{s.bg}}; display: flex; align-items: center; gap: 12px; opacity: {{s.op}}">
<span style="width: 46px; height: 46px; border-radius: 50%; background: {{s.icBg}}; display: flex; align-items: center; justify-content: center; flex: none">
<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="{{s.icFg}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{s.icon}}"/></svg>
</span>
<span class="n" style="font-size: 19px; font-weight: 800; line-height: 1.2">{{s.t}}</span>
</div>
</sc-for>
</div>
</div>
</sc-if>

<sc-if value="{{rested}}" hint-placeholder-val="{{false}}">
<div class="isIn" style="margin-top: 14px; display: flex; flex-direction: column; align-items: flex-start; gap: 16px">
<div class="f" style="font-size: 32px; font-weight: 700; color: #FFE066">{{t.doneTitle}}</div>
<a href="{{contH}}" onClick="{{cont}}" class="f tap" style="height: 76px; padding: 0 36px; border-radius: 999px; background: #26A03B; box-shadow: 0 8px 0 #1E8A31; color: #FFFFFF; font-size: 28px; font-weight: 600; display: flex; align-items: center; gap: 12px">
<span>{{t.cont}}</span>
<svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h13"/><path d="M13 6l6 6-6 6"/></svg>
</a>
</div>
</sc-if>

<sc-if value="{{over}}" hint-placeholder-val="{{false}}">
<div style="margin-top: 14px; box-sizing: border-box; padding: 22px 24px; border-radius: 26px; background: rgba(255,255,255,.12); box-shadow: inset 0 0 0 2px rgba(255,255,255,.2); display: flex; align-items: center; gap: 16px">
<svg viewBox="0 0 24 24" width="44" height="44" fill="none" stroke="#FFE066" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
<span class="n" style="font-size: 20px; font-weight: 800; line-height: 1.35; color: #F1EDFF">{{t.overNote}}</span>
</div>
</sc-if>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"jenis":{"editor":"enum","options":["istirahat","habis"],"default":"istirahat","section":"Layar"},"lang":{"editor":"enum","options":["auto","id","en"],"default":"auto","section":"Bahasa"},"app":{"editor":null},"$preview":{"width":1180,"height":820}}'>
class Component extends DCLogic {
  pref(k) {
    var a = this.props.app;
    if (a && a.prefs) return a.prefs[k] || '';
    var st = this.state || {};
    if (st['p_' + k] !== undefined) return st['p_' + k];
    try { var v = window.localStorage.getItem('moci-' + k); if (v !== null) return v; } catch (e) {}
    return '';
  }
  L() {
    var p = this.props.lang;
    if (p === 'id' || p === 'en') return p;
    return this.pref('lang') === 'en' ? 'en' : 'id';
  }
  lk(names) {
    var a = this.props.app, o = {};
    names.forEach((n) => {
      o[n] = (a && a.nav) ? { h: '#', go: (e) => { try { e.preventDefault(); } catch (x) {} a.nav(n); } } : { h: n + '.dc.html', go: null };
    });
    return o;
  }
  jenis() {
    var a = this.props.app;
    if (a && a.params && a.params.jenis) return a.params.jenis === 'habis' ? 'habis' : 'istirahat';
    return this.props.jenis === 'habis' ? 'habis' : 'istirahat';
  }
  speak(t, lang) {
    try {
      var s = window.speechSynthesis;
      if (!s || typeof SpeechSynthesisUtterance === 'undefined') return;
      s.cancel();
      var u = new SpeechSynthesisUtterance(t);
      var en = (lang || this.L()) === 'en';
      u.lang = en ? 'en-US' : 'id-ID'; u.rate = 0.85; u.pitch = 1.1;
      var re = en ? /^en/i : /^id/i;
      var vs = s.getVoices ? s.getVoices() : [];
      for (var i = 0; i < vs.length; i++) { if (re.test(vs[i].lang)) { u.voice = vs[i]; break; } }
      s.speak(u);
    } catch (e) {}
  }
  componentDidMount() {
    var app = this.props.app;
    if (this.jenis() === 'istirahat') {
      this.setState({ left: app ? 20 : 12 });
      this._iv = setInterval(() => {
        var s = this.state || {};
        var l = (s.left === undefined ? 12 : s.left) - 1;
        if (l <= 0) { clearInterval(this._iv); l = 0; }
        this.setState({ left: l });
      }, 1000);
    }
    if (app) {
      var T = this.texts();
      this.speak(this.jenis() === 'habis' ? T.overTitle : T.title + ' ' + T.steps[0]);
    }
  }
  componentWillUnmount() { clearInterval(this._iv); }
  texts() {
    var en = this.L() === 'en';
    var nm = String(this.pref('name') || '').trim();
    return en
      ? { title: 'Time for a little break!', sub: 'Your eyes and body need a rest too. Follow Moci until the countdown ends.', steps: ['Look far out the window', 'Blink 10 times', 'Stretch your arms up high'], doneTitle: 'All fresh again!', cont: 'Keep playing', overTitle: 'Playtime is over for today', overSub: 'See you tomorrow, ' + (nm || 'little one') + '! Moci is going to sleep too.', overNote: 'A grown-up can change the daily time limit in Parents’ Corner.', parents: 'For grown-ups', secs: 'seconds', timer: 'Break time left: ' }
      : { title: 'Istirahat sebentar, yuk!', sub: 'Mata dan badan juga perlu istirahat. Ikuti Moci sampai hitungannya selesai.', steps: ['Lihat jauh ke luar jendela', 'Kedip-kedip 10 kali', 'Regangkan tangan ke atas'], doneTitle: 'Sudah segar lagi!', cont: 'Lanjut main', overTitle: 'Waktu main hari ini sudah habis', overSub: 'Sampai besok, ' + (nm || 'Adik') + '! Moci juga mau tidur dulu.', overNote: 'Orang tua bisa mengubah batas waktu harian di Area Orang Tua.', parents: 'Untuk orang tua', secs: 'detik', timer: 'Sisa waktu istirahat: ' };
  }
  renderVals() {
    var st = this.state || {};
    var T = this.texts();
    var j = this.jenis();
    var a = this.props.app;
    var left = st.left === undefined ? 12 : st.left;
    var step = left > 13 ? 0 : (left > 6 ? 1 : 2);
    var ICONS = [
      'M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6zM12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6z',
      'M3 11c2.5 3 5.5 4.5 9 4.5S18.5 14 21 11M7 15l-1.5 2M12 16.5V19M17 15l1.5 2',
      'M12 7a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM6 3l3 6h6l3-6M9 9v5l-2 7M15 9v5l2 7M9 14h6'
    ];
    var back = (a && a.params && a.params.back) || 'Main';
    return {
      t: T,
      lk: this.lk(['Gate', 'Main']),
      title: j === 'habis' ? T.overTitle : T.title,
      sub: j === 'habis' ? T.overSub : T.sub,
      counting: j === 'istirahat' && left > 0,
      rested: j === 'istirahat' && left <= 0,
      over: j === 'habis',
      left: left,
      timerLabel: T.timer + left + ' ' + T.secs,
      ringOff: (389.6 * (1 - left / 20)).toFixed(1),
      steps: T.steps.map((s, i) => ({
        t: s, icon: ICONS[i],
        bg: i === step ? 'rgba(255,255,255,.2)' : 'rgba(255,255,255,.07)',
        op: i === step ? 1 : 0.7,
        icBg: i === step ? '#FFD43B' : 'rgba(255,255,255,.16)',
        icFg: i === step ? '#2B2350' : '#FFFFFF'
      })),
      contH: (a && a.nav) ? '#' : 'Main.dc.html',
      cont: (a && a.nav) ? (e) => { try { e.preventDefault(); } catch (x) {} a.nav(back); } : null
    };
  }
}
</script>
</body>
</html>
