          g: { semua: 'Semua', rumah: 'Peliharaan & Ternak', liar: 'Hutan & Savana', reptil: 'Reptil & Katak', air: 'Laut & Air', kecil: 'Burung & Serangga' } };
    var D = this.data();
    var grp = st.grp || 'semua';
    var list = D.filter((a) => grp === 'semua' || a[4] === grp);
    var key = st.k || 'sapi';
    var idx = 0;
    for (var i = 0; i < list.length; i++) if (list[i][0] === key) { idx = i; break; }
    var a = list[idx] || D[0];
    var name = en ? a[2] : a[1];
    var sound = en ? a[6] : a[5];
    var fact = en ? a[8] : a[7];
    var go = (j) => {
      var b = list[(j + list.length) % list.length];
      var s2 = this.state || {};
      this.setState({ k: b[0], jump: !s2.jump, bub: !s2.bub, heard: true });
      this.speak((en ? b[2] : b[1]) + '! ' + (en ? b[6] : b[5]));
    };
    var groupKeys = ['semua', 'rumah', 'liar', 'reptil', 'air', 'kecil'];
    return {
      t: T,
      lk: this.lk(['Main']),
      counter: (idx + 1) + ' / ' + list.length,
      cur: { img: '/_blob/' + a[3], name: name, sound: sound, fact: fact, aria: name + T.tapToHear },
      nameSize: name.length > 11 ? 38 : (name.length > 8 ? 44 : 52),
      soundSize: sound.length > 13 ? 26 : (sound.length > 9 ? 32 : 40),
      jumpClass: st.jump === undefined ? '' : (st.jump ? 'hwJumpA' : 'hwJumpB'),
      bubClass: st.bub ? 'hwBubA' : 'hwBubB',
      showBubble: true,
      groups: groupKeys.map((g) => ({
        t: T.g[g], on: grp === g,
        bg: grp === g ? '#2F9E44' : '#FFFFFF', fg: grp === g ? '#FFFFFF' : '#2B2350', sh: grp === g ? '#1E7A33' : '#9FD3A0',
        pick: () => {
          var nl = D.filter((x) => g === 'semua' || x[4] === g);
          var keep = nl.some((x) => x[0] === key);
          this.setState({ grp: g, k: keep ? key : nl[0][0] });
          this.speak(T.g[g]);
        }
      })),
      animals: list.map((b, j) => ({
        img: '/_blob/' + b[3], name: en ? b[2] : b[1], on: j === idx,
        ring: j === idx ? '#FFB020' : '#FFFFFF', sh: j === idx ? '#E0870B' : '#9FD3A0', lift: j === idx ? 'translateY(-8px)' : 'none',
        pick: () => go(j)
      })),
      prev: () => go(idx - 1),
      next: () => go(idx + 1),
      tapAnimal: () => { var s2 = this.state || {}; this.setState({ jump: !s2.jump, bub: !s2.bub }); this.play(a[9], sound); },
      sayName: () => this.speak(name),
      saySound: () => { var s2 = this.state || {}; this.setState({ bub: !s2.bub }); this.play(a[9], sound); },
      sayFact: () => this.speak(fact)
    };
  }
}
