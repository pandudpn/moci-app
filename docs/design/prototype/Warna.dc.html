      ['putih', 'Putih', 'White', '#FFFFFF', '#2B2350', '#ADB5BD'],
      ['abu-abu', 'Abu-abu', 'Gray', '#ADB5BD', '#2B2350', '#868E96']
    ];
  }
  shuffle(a) {
    var b = a.slice();
    for (var i = b.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = b[i]; b[i] = b[j]; b[j] = t; }
    return b;
  }
  makeSet(ck) {
    var P = this.pics();
    var C = this.colors();
    var shapes = ['balon', 'bintang', 'hati'];
    var mine = this.shuffle(P.filter((p) => p[4] === ck)).slice(0, 4).map((p) => ({ t: 'img', k: p[0], c: ck }));
    var nT = 4 + Math.floor(Math.random() * 2);
    while (mine.length < nT) mine.push({ t: shapes[mine.length % 3], c: ck });
    var others = this.shuffle(P.filter((p) => p[4] !== ck)).slice(0, 12 - nT - 2).map((p) => ({ t: 'img', k: p[0], c: p[4] }));
    var oc = this.shuffle(C.filter((c) => c[0] !== ck));
    others.push({ t: shapes[Math.floor(Math.random() * 3)], c: oc[0][0] });
    others.push({ t: shapes[Math.floor(Math.random() * 3)], c: oc[1][0] });
    return { ck: ck, items: this.shuffle(mine.concat(others)), found: {} };
  }
  set() {
    var st = this.state || {};
    if (st.s) return st.s;
    return {
      ck: 'merah', fresh: true, found: { 0: true },
      items: [{ t: 'img', k: 'apel', c: 'merah' }, { t: 'img', k: 'pisang', c: 'kuning' }, { t: 'balon', c: 'merah' }, { t: 'img', k: 'brokoli', c: 'hijau' },
              { t: 'img', k: 'ikan', c: 'biru' }, { t: 'img', k: 'stroberi', c: 'merah' }, { t: 'bintang', c: 'kuning' }, { t: 'img', k: 'anggur', c: 'ungu' },
              { t: 'img', k: 'jeruk', c: 'oranye' }, { t: 'hati', c: 'biru' }, { t: 'img', k: 'tomat', c: 'merah' }, { t: 'img', k: 'gajah', c: 'abu-abu' }]
    };
  }
  renderVals() {
    var st = this.state || {};
    var en = this.L() === 'en';
    var T = en
      ? { title: 'Colors', back: 'Back to home', hear: 'Listen', pick: 'Pick a color', newSet: 'New pictures', nextColor: 'Next color', yes: 'Yes! ', no: 'Not this one. Find ', shapes: { balon: 'balloon', bintang: 'star', hati: 'heart' } }
      : { title: 'Warna', back: 'Kembali ke beranda', hear: 'Dengar', pick: 'Pilih warna', newSet: 'Gambar baru', nextColor: 'Warna lain', yes: 'Betul! ', no: 'Bukan yang ini. Cari yang ', shapes: { balon: 'balon', bintang: 'bintang', hati: 'hati' } };
    var C = this.colors();
    var cmap = {}; C.forEach((c) => { cmap[c[0]] = c; });
    var P = this.pics();
    var pmap = {}; P.forEach((p) => { pmap[p[0]] = p; });
    var S = this.set();
    var tc = cmap[S.ck];
    var cname = en ? tc[2] : tc[1];
    var total = S.items.filter((x) => x.c === S.ck).length;
    var foundN = Object.keys(S.found).length;
    var allFound = foundN >= total && !S.fresh;
    var itemName = (x) => {
      var cn = en ? cmap[x.c][2].toLowerCase() : cmap[x.c][1].toLowerCase();
      if (x.t === 'img') return en ? pmap[x.k][2] : pmap[x.k][1];
      return en ? (cn + ' ' + T.shapes[x.t]) : (T.shapes[x.t] + ' ' + cn);
    };
    var say = en ? ('Tap everything that is ' + cname.toLowerCase() + '!') : ('Sentuh semua yang berwarna ' + cname.toLowerCase() + '!');
    return {
      t: T,
      lk: this.lk(['Main']),
      tg: { hex: tc[3], txt: tc[4], line: tc[5], name: cname, up: cname.toUpperCase(), fs: cname.length > 8 ? 38 : 48 },
      ins: en ? { pre: 'Tap everything ', post: '!' } : { pre: 'Sentuh semua yang ', post: '!' },
      foundN: foundN,
      total: total,
      allFound: allFound,
      doneText: en ? ('You found all the ' + cname.toLowerCase() + ' things!') : ('Semua yang ' + cname.toLowerCase() + ' ketemu!'),
      sayColor: () => this.speak(say),
      shuffle: () => { var s2 = this.makeSet(S.ck); this.setState({ s: s2 }); this.speak(say); },
      nextColor: () => {
        var keys = C.map((c) => c[0]);
        var nk = keys[(keys.indexOf(S.ck) + 1) % keys.length];
        this.setState({ s: this.makeSet(nk) });
        var nc = cmap[nk];
        this.speak(en ? ('Tap everything that is ' + nc[2].toLowerCase() + '!') : ('Sentuh semua yang berwarna ' + nc[1].toLowerCase() + '!'));
      },
      chips: C.map((c) => ({
        hex: c[3], name: en ? c[2] : c[1], on: c[0] === S.ck,
        ring: c[0] === S.ck ? '#2B2350' : (c[0] === 'putih' ? '#DEE2E6' : '#FFFFFF'),
        lift: c[0] === S.ck ? 'translateY(-6px) scale(1.08)' : 'none',
        pick: () => {
          this.setState({ s: this.makeSet(c[0]) });
          this.speak(en ? ('Tap everything that is ' + c[2].toLowerCase() + '!') : ('Sentuh semua yang berwarna ' + c[1].toLowerCase() + '!'));
        }
      })),
      items: S.items.map((x, i) => {
        var got = !!S.found[i];
        var cc = cmap[x.c];
        var nm = itemName(x);
        return {
          isImg: x.t === 'img', isBalloon: x.t === 'balon', isStar: x.t === 'bintang', isHeart: x.t === 'hati',
          img: x.t === 'img' ? '/_blob/' + pmap[x.k][3] : '',
          fill: cc[3], line: cc[5],
          name: nm, got: got, delay: S.fresh ? '0' : (i * 0.03).toFixed(2),
          bd: got ? '#26A03B' : '#EFE9FF',
          cls: (S.fresh ? '' : 'wnIn') + (st.hit === i ? (st.ok ? (st.fl ? ' wnOkA' : ' wnOkB') : (st.fl ? ' wnNoA' : ' wnNoB')) : ''),
          tap: () => {
            var S2 = this.set();
            if (S2.found[i] && !S2.fresh) return;
            var s3 = this.state || {};
            if (x.c === S2.ck) {
              var found = S2.fresh ? {} : Object.assign({}, S2.found);
              found[i] = true;
              this.setState({ s: { ck: S2.ck, items: S2.items, found: found }, hit: i, ok: true, fl: !s3.fl });
              this.speak(T.yes + nm + '!');
            } else {
              this.setState({ hit: i, ok: false, fl: !s3.fl });
              this.speak(nm + '. ' + T.no + cname.toLowerCase() + '!');
            }
          }
        };
      })
    };
  }
}
</script>
