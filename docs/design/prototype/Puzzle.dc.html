<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Moci · Puzzle</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&amp;family=Nunito:wght@600;700;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.f{font-family:'Fredoka',ui-rounded,'Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif}
.n{font-family:'Nunito',ui-rounded,system-ui,-apple-system,'Segoe UI',sans-serif}
a{color:#2B2350;text-decoration:none}a:hover{color:#2B2350}
button{font:inherit;color:inherit;border:0;padding:0;margin:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
.tap{transition:transform .12s ease}.tap:active{transform:translateY(5px) scale(.97)}
.pzIn{animation:pzIn .4s cubic-bezier(.3,1.6,.5,1) both}
.pzNoA{animation:pzNoA .45s ease 1}
.pzNoB{animation:pzNoB .45s ease 1}
.pzDone{animation:pzDone .6s cubic-bezier(.3,1.5,.5,1) both}
@keyframes pzIn{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes pzNoA{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
@keyframes pzNoB{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
@keyframes pzDone{0%{transform:translateY(30px);opacity:0}100%{transform:translateY(0);opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div class="f" style="position: relative; width: 1180px; height: 820px; overflow: hidden; background-color: #FFF4E0; background-image: radial-gradient(#FFE3B3 3px, transparent 3px); background-size: 36px 36px; color: #2B2350">

<div style="position: absolute; left: 32px; right: 32px; top: 22px; display: flex; align-items: center; gap: 16px">

<svg viewBox="0 0 24 24" width="38" height="38" fill="none" stroke="#2B2350" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>

<h1 class="f" style="margin: 0; font-size: 44px; font-weight: 700; white-space: nowrap">{{t.title}}</h1>
<div style="flex: 1"></div>
<div class="n" style="height: 58px; padding: 0 22px; border-radius: 999px; background: #FFFFFF; box-shadow: 0 6px 0 #F2C57C; display: flex; align-items: center; font-size: 20px; font-weight: 900">{{countLabel}}</div>
<button class="f tap" onClick="{{other}}" style="height: 58px; padding: 0 22px; border-radius: 999px; background: #FFB020; box-shadow: 0 6px 0 #E0870B; font-size: 21px; font-weight: 600; display: flex; align-items: center; gap: 8px">
<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#2B2350" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4v6h6"/><path d="M20 20v-6h-6"/><path d="M5.5 15a7 7 0 0 0 12.2 2.5M18.5 9A7 7 0 0 0 6.3 6.5"/></svg>
<span>{{t.other}}</span>
</button>
</div>

<div role="group" aria-label="{{t.board}}" style="position: absolute; left: 60px; top: 128px; width: 480px; height: 480px; border-radius: 26px; background: #FFFFFF; box-shadow: 0 10px 0 #F2C57C, 0 22px 36px rgba(43,35,80,.10); overflow: hidden">
<img src="{{pic}}" alt="" style="position: absolute; left: 0; top: 0; width: 480px; height: 480px; opacity: .16">
<sc-for list="{{slots}}" as="s" hint-placeholder-count="4">
<sc-if value="{{s.filled}}" hint-placeholder-val="{{false}}">
<div class="pzIn" style="position: absolute; left: {{s.x}}px; top: {{s.y}}px; width: {{s.w}}px; height: {{s.h}}px; overflow: hidden">
<img src="{{pic}}" alt="" style="position: absolute; left: {{s.ix}}px; top: {{s.iy}}px; width: 480px; height: 480px">
</div>
</sc-if>
<sc-if value="{{s.open}}" hint-placeholder-val="{{true}}">
<button class="{{s.cls}}" onClick="{{s.place}}" aria-label="{{s.label}}" style="position: absolute; left: {{s.x}}px; top: {{s.y}}px; width: {{s.w}}px; height: {{s.h}}px; box-sizing: border-box; border: 4px dashed {{s.bd}}; border-radius: 16px; background: {{s.bg}}"></button>
</sc-if>
</sc-for>
</div>
<p class="n" style="position: absolute; left: 60px; top: 636px; width: 480px; margin: 0; display: flex; align-items: center; gap: 10px; font-size: 19px; font-weight: 800; color: #8A5A10">
<img src="/_blob/0b224341bbd230f2dd731c560e41d4cb" alt="" style="width: 48px; height: 48px">
<span>{{hint}}</span>
</p>

<div style="position: absolute; left: 600px; top: 128px; width: 520px; height: 480px; box-sizing: border-box; padding: 16px; border-radius: 26px; background: rgba(255,255,255,.7); box-shadow: inset 0 0 0 3px #FFE3B3; display: flex; flex-wrap: wrap; align-content: flex-start; gap: 16px">
<sc-for list="{{tray}}" as="p" hint-placeholder-count="2">
<button class="tap" onClick="{{p.pick}}" aria-label="{{p.label}}" aria-pressed="{{p.on}}" style="position: relative; width: {{p.w}}px; height: {{p.h}}px; border-radius: 16px; overflow: hidden; background: #FFFFFF; box-shadow: 0 6px 0 #F2C57C{{p.ring}}">
<img src="{{pic}}" alt="" style="position: absolute; left: {{p.ix}}px; top: {{p.iy}}px; width: {{p.size}}px; height: {{p.size}}px">
</button>
</sc-for>
</div>

<sc-if value="{{done}}" hint-placeholder-val="{{false}}">
<div class="pzDone" role="status" style="position: absolute; left: 600px; top: 128px; width: 520px; height: 480px; box-sizing: border-box; padding: 26px; border-radius: 26px; background: #FFFFFF; box-shadow: 0 10px 0 #F2C57C; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center">
<img src="/_blob/c6f764abf556b8252c9552e7fa94a90d" alt="" style="width: 170px; height: 170px">
<div class="f" style="font-size: 38px; font-weight: 700; line-height: 1.15">{{doneText}}</div>
<div style="display: flex; gap: 14px">
<button class="f tap" onClick="{{other}}" style="height: 66px; padding: 0 26px; border-radius: 999px; background: #FFB020; box-shadow: 0 7px 0 #E0870B; font-size: 22px; font-weight: 600">{{t.other}}</button>
<a href="{{lk.Hebat.h}}" onClick="{{lk.Hebat.go}}" class="f tap" style="height: 66px; padding: 0 26px; border-radius: 999px; background: #26A03B; box-shadow: 0 7px 0 #1E8A31; color: #FFFFFF; font-size: 22px; font-weight: 600; display: flex; align-items: center">{{t.prize}}</a>
</div>
</div>
</sc-if>

</div>
</x-dc>

          on: g.sel === s, ring: g.sel === s ? ', 0 0 0 6px #2B2350' : '', label: T.piece + (s + 1),
          pick: () => { setG({ sel: s }); }
        };
      }),
      done: done,
      doneText: T.done + name + '!',
      other: () => { this.setState({ game: this.newGame(g.key), bad: -1 }); this.speak(T.hintPick); }
    };
  }
}
</script>
</body>
