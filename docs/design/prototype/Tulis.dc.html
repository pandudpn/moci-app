<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Moci · Tulis Huruf &amp; Angka</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&amp;family=Nunito:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.f{font-family:'Fredoka',ui-rounded,'Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif}
.n{font-family:'Nunito',ui-rounded,system-ui,-apple-system,'Segoe UI',sans-serif}
a{color:#2B2350;text-decoration:none}a:hover{color:#2B2350}
button{font:inherit;color:inherit;border:0;padding:0;margin:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
.tap{transition:transform .12s ease}.tap:active{transform:translateY(5px) scale(.97)}
.sw{transition:transform .15s ease}
.trRing{animation:trRing 1.6s ease-out infinite}
.trGoal{animation:trRing 1.8s ease-out infinite}
.trTwinkle{animation:trTwinkle 1.6s ease-in-out infinite}
.trIdle{animation:trIdle 1.3s ease-in-out infinite}
.trDrag{transform:scale(1.18);transition:transform .15s ease}
.trNudgeA{animation:trNudgeA .5s ease 1}
.trNudgeB{animation:trNudgeB .5s ease 1}
.trBoomA{animation:trBoomA .8s ease-out both}
.trBoomB{animation:trBoomB .8s ease-out both}
.trStarA{animation:trStarA .9s cubic-bezier(.3,1.5,.5,1) both}
.trStarB{animation:trStarB .9s cubic-bezier(.3,1.5,.5,1) both}
.trPop1{animation:trPop .5s cubic-bezier(.3,1.6,.5,1) both}
.trPop2{animation:trPop .5s cubic-bezier(.3,1.6,.5,1) .15s both}
.trPop3{animation:trPop .5s cubic-bezier(.3,1.6,.5,1) .3s both}
.trRise{animation:trRise .45s cubic-bezier(.3,1.5,.5,1) both}
.trPeek{animation:trPeek 3s ease-in-out infinite;transform-origin:50% 100%}
.trFlow{animation:trFlow .9s linear infinite}
.trChev{animation:trChev 1.4s ease-in-out infinite}
.trGhost{position:absolute;left:0;top:0;width:60px;height:64px;offset-rotate:0deg;offset-anchor:33% 3%;animation:trGhost 2.6s ease-in-out infinite}
@supports not (offset-path: path('M0 0L1 1')){.trGhost{display:none}}
@keyframes trRing{0%{transform:scale(1);opacity:.55}100%{transform:scale(1.9);opacity:0}}
@keyframes trTwinkle{0%,100%{transform:scale(1) rotate(0deg)}50%{transform:scale(1.15) rotate(14deg)}}
@keyframes trIdle{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes trNudgeA{0%,100%{transform:rotate(0)}25%{transform:rotate(-14deg)}75%{transform:rotate(14deg)}}
@keyframes trNudgeB{0%,100%{transform:rotate(0)}25%{transform:rotate(-14deg)}75%{transform:rotate(14deg)}}
@keyframes trBoomA{0%{transform:scale(.3);opacity:1}100%{transform:scale(2.3);opacity:0}}
@keyframes trBoomB{0%{transform:scale(.3);opacity:1}100%{transform:scale(2.3);opacity:0}}
@keyframes trStarA{0%{transform:scale(0);opacity:1}55%{transform:scale(1.45);opacity:1}100%{transform:scale(1) translateY(-34px);opacity:0}}
@keyframes trStarB{0%{transform:scale(0);opacity:1}55%{transform:scale(1.45);opacity:1}100%{transform:scale(1) translateY(-34px);opacity:0}}
@keyframes trPop{0%{transform:scale(0) rotate(-30deg)}100%{transform:scale(1) rotate(0)}}
@keyframes trRise{0%{transform:translateY(40px);opacity:0}100%{transform:translateY(0);opacity:1}}
@keyframes trPeek{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-8px) rotate(3deg)}}
@keyframes trFlow{to{stroke-dashoffset:-30}}
@keyframes trChev{0%,100%{opacity:.45;transform:scale(.8)}35%{opacity:1;transform:scale(1.2)}}
@keyframes trGhost{0%{offset-distance:0%;opacity:0}12%{offset-distance:0%;opacity:.95}80%{offset-distance:100%;opacity:.95}100%{offset-distance:100%;opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div class="f" style="position: relative; width: 1180px; height: 820px; overflow: hidden; background-color: {{th.bg}}; background-image: radial-gradient({{th.dot}} 3px, transparent 3px); background-size: 36px 36px; color: #2B2350">

<div style="position: absolute; left: 32px; right: 32px; top: 22px; display: flex; align-items: center; gap: 18px">
<a href="{{lk.Main.h}}" onClick="{{lk.Main.go}}" class="tap" aria-label="{{t.back}}" style="width: 76px; height: 76px; border-radius: 26px; background: #FFFFFF; box-shadow: 0 7px 0 {{th.softSh}}; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 24 24" width="38" height="38" fill="none" stroke="#2B2350" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
</a>
<h1 class="f" style="margin: 0; font-size: 46px; font-weight: 700">{{t.title}}</h1>
<div style="flex: 1"></div>
<sc-if value="{{isHuruf}}" hint-placeholder-val="{{true}}">
<nav aria-label="{{t.modes}}" style="display: flex; gap: 6px; padding: 6px; background: #FFFFFF; border-radius: 999px; box-shadow: 0 6px 0 {{th.softSh}}">

<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
<span>{{t.learn}}</span>
</a>
<a href="{{lk.Tulis.h}}" onClick="{{lk.Tulis.go}}" aria-current="page" class="f" style="display: flex; align-items: center; gap: 8px; height: 56px; padding: 0 22px; border-radius: 999px; background: {{th.acc}}; color: #FFFFFF; font-size: 24px; font-weight: 600">
<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20l4-1 11-11-3-3L5 16z"/><path d="M14 6l3 3"/></svg>
<span>{{t.write}}</span>
</a>
<a href="{{lk.Ucapkan.h}}" onClick="{{lk.Ucapkan.go}}" class="f tap" style="display: flex; align-items: center; gap: 8px; height: 56px; padding: 0 22px; border-radius: 999px; color: #2B2350; font-size: 24px; font-weight: 600">
<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0"/><path d="M12 17.5V21"/></svg>
<span>{{t.say}}</span>
</a>
</nav>
</sc-if>
<sc-if value="{{isAngka}}" hint-placeholder-val="{{false}}">
<nav aria-label="{{t.modes}}" style="display: flex; gap: 6px; padding: 6px; background: #FFFFFF; border-radius: 999px; box-shadow: 0 6px 0 {{th.softSh}}">
<a href="{{lk.Angka.h}}" onClick="{{lk.Angka.go}}" class="f tap" style="display: flex; align-items: center; gap: 8px; height: 56px; padding: 0 22px; border-radius: 999px; color: #2B2350; font-size: 24px; font-weight: 600">
<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="7" cy="7" r="3"/><circle cx="17" cy="7" r="3"/><circle cx="7" cy="17" r="3"/><circle cx="17" cy="17" r="3"/></svg>
<span>{{t.count}}</span>
</a>
<a href="{{lk.AngkaTulis.h}}" onClick="{{lk.AngkaTulis.go}}" aria-current="page" class="f" style="display: flex; align-items: center; gap: 8px; height: 56px; padding: 0 22px; border-radius: 999px; background: {{th.acc}}; color: #FFFFFF; font-size: 24px; font-weight: 600">
<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20l4-1 11-11-3-3L5 16z"/><path d="M14 6l3 3"/></svg>
<span>{{t.write}}</span>
</a>
</nav>
</sc-if>
<div class="f" style="display: flex; align-items: center; gap: 8px; height: 64px; padding: 0 22px 0 14px; background: #FFFFFF; border-radius: 999px; box-shadow: 0 6px 0 {{th.softSh}}; font-size: 30px; font-weight: 700">
<svg viewBox="0 0 40 40" width="40" height="40" aria-hidden="true"><path d="M20 3l5.2 10.6 11.7 1.7-8.5 8.2 2 11.6L20 29.6 9.6 35.1l2-11.6-8.5-8.2 11.7-1.7z" fill="#FFC21A" stroke="#F08C00" stroke-width="2" stroke-linejoin="round"/></svg>
<span>24</span>

</div>

<div style="position: absolute; left: 32px; top: 120px; width: 236px; height: 650px; border-radius: 36px; background: #FFFFFF; box-shadow: 0 10px 0 {{th.cardSh}}">

</sc-for>
</div>

</div>

<div style="position: absolute; left: 290px; top: 120px; width: 600px; height: 650px; border-radius: 40px; background: #FFFFFF; box-shadow: 0 12px 0 {{th.cardSh}}, 0 26px 40px rgba(43,35,80,.12)">
<div style="position: absolute; left: 30px; right: 30px; top: 20px; height: 48px; display: flex; align-items: center; justify-content: space-between">

<div class="n" style="font-size: 18px; font-weight: 800; color: #6B5F99">{{progress}}</div>
</div>

<div style="position: absolute; left: 30px; top: 78px; width: 520px; height: 520px; transform: scale(1.0385); transform-origin: 0 0">

<defs>
<pattern id="mociStarsTulis2" width="34" height="34" patternUnits="userSpaceOnUse">
<path d="M17 7l2.6 5.2 5.7.8-4.1 4 1 5.6-5.2-2.7-5.2 2.7 1-5.6-4.1-4 5.7-.8z" fill="#FFFFFF" opacity=".55"/>
<circle cx="4" cy="29" r="2.4" fill="#FFFFFF" opacity=".5"/>
</pattern>

<path d="M20 70H500" stroke="#CFE3FF" stroke-width="3"/>

<path d="M20 450H500" stroke="#CFE3FF" stroke-width="3"/>

<path d="{{g.curD}}" stroke="#4C3F86" stroke-width="66" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<path class="trFlow" d="{{g.curD}}" stroke="#FFD43B" stroke-width="7" stroke-linecap="round" stroke-dasharray="14 16" fill="none"/>
<path d="{{g.curD}}" pathLength="1" stroke="{{ink}}" stroke-width="60" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="{{g.dash}}" fill="none"/>
<path d="{{g.curD}}" pathLength="1" stroke="url(#mociStarsTulis2)" stroke-width="60" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="{{g.dash}}" fill="none"/>
</svg>

</div>
</sc-for>

</div>
</sc-if>

<div class="{{burst.ring}}" style="position: absolute; left: -50px; top: -50px; width: 100px; height: 100px; box-sizing: border-box; border-radius: 50%; border: 7px solid #FFD43B"></div>
<svg class="{{burst.star}}" viewBox="0 0 40 40" width="80" height="80" style="position: absolute; left: -40px; top: -40px"><path d="M20 3l5.2 10.6 11.7 1.7-8.5 8.2 2 11.6L20 29.6 9.6 35.1l2-11.6-8.5-8.2 11.7-1.7z" fill="#FFC21A" stroke="#F08C00" stroke-width="2.4" stroke-linejoin="round"/></svg>
</div>
</sc-if>
<sc-if value="{{showGuide}}" hint-placeholder-val="{{true}}">

<div class="f" style="position: absolute; left: 20px; top: -58px; width: 32px; height: 32px; box-sizing: border-box; border-radius: 50%; background: #4C3F86; border: 3px solid #FFFFFF; color: #FFFFFF; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{guide.num}}</div>
</div>
</sc-if>

</div>
</sc-if>
</div>
</div>

<svg class="trPop2" viewBox="0 0 40 40" width="52" height="52"><path d="M20 3l5.2 10.6 11.7 1.7-8.5 8.2 2 11.6L20 29.6 9.6 35.1l2-11.6-8.5-8.2 11.7-1.7z" fill="#FFC21A" stroke="#F08C00" stroke-width="2" stroke-linejoin="round"/></svg>
<svg class="trPop3" viewBox="0 0 40 40" width="40" height="40"><path d="M20 3l5.2 10.6 11.7 1.7-8.5 8.2 2 11.6L20 29.6 9.6 35.1l2-11.6-8.5-8.2 11.7-1.7z" fill="#FFC21A" stroke="#F08C00" stroke-width="2" stroke-linejoin="round"/></svg>
</div>
<div class="f" style="flex: 1; font-size: 36px; font-weight: 700; color: {{th.acc}}">{{t.great}}</div>

</button>

<span>{{t.next}}</span>
<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
</button>
</div>
</sc-if>
</div>

<div style="position: absolute; left: 912px; top: 120px; width: 236px; height: 650px; border-radius: 36px; background: #FFFFFF; box-shadow: 0 10px 0 {{th.cardSh}}">
<div class="n" style="position: absolute; left: 0; right: 0; top: 22px; text-align: center; font-size: 18px; font-weight: 800; color: #6B5F99">{{t.crayons}}</div>
<div role="group" aria-label="{{t.crayons}}" style="position: absolute; left: 0; right: 0; top: 60px; display: flex; flex-direction: column; align-items: center; gap: 14px">
<sc-for list="{{colors}}" as="c" hint-placeholder-count="5">

</sc-for>
</div>
<div aria-hidden="true" style="position: absolute; left: 30px; right: 30px; top: 462px; height: 3px; border-radius: 3px; background: {{th.soft}}"></div>
<button class="f tap" onClick="{{reset}}" style="position: absolute; left: 28px; top: 486px; width: 180px; height: 60px; border-radius: 999px; background: {{th.soft}}; box-shadow: 0 5px 0 {{th.softSh}}; font-size: 22px; font-weight: 600; color: #2B2350; display: flex; align-items: center; justify-content: center; gap: 8px">
<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.6-5.9"/><path d="M4 4v5h5"/></svg>
