<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Moci · Splash intro (HP)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@700&amp;family=Nunito:wght@900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.shDrop{animation:shDrop 5s ease-out infinite;transform-origin:50% 100%}
.shBob{animation:shBob 2.4s ease-in-out infinite}
.shPop{display:inline-block;animation:shPop 5s ease-out infinite}
.shFade{animation:shFade 5s ease-out infinite}
.shDot{animation:shDot 1s ease-in-out infinite}
.shCloud{animation-name:shCloud;animation-timing-function:linear;animation-iteration-count:infinite}
.shSpin{animation:shSpin 40s linear infinite;transform-origin:50% 50%}
.shTw{animation:shTw 2.4s ease-in-out infinite}
@keyframes shDrop{0%{transform:translateY(-320px);opacity:1}14%{transform:translateY(0) scale(1.08,.9)}20%{transform:translateY(-20px) scale(.97,1.04)}26%{transform:translateY(0) scale(1)}88%{transform:translateY(0);opacity:1}96%{transform:translateY(0);opacity:0}100%{transform:translateY(-320px);opacity:0}}
@keyframes shBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes shPop{0%,22%{transform:scale(0);opacity:0}30%{transform:scale(1.22);opacity:1}36%{transform:scale(.95)}40%{transform:scale(1)}88%{transform:scale(1);opacity:1}96%,100%{transform:scale(.85);opacity:0}}
@keyframes shFade{0%,38%{transform:translateY(10px);opacity:0}46%{transform:translateY(0);opacity:1}88%{opacity:1}96%,100%{opacity:0}}
@keyframes shDot{0%,60%,100%{transform:translateY(0);opacity:.55}30%{transform:translateY(-8px);opacity:1}}
@keyframes shCloud{from{transform:translateX(-200px)}to{transform:translateX(1050px)}}
@keyframes shSpin{to{transform:rotate(360deg)}}
@keyframes shTw{0%,100%{opacity:.35;transform:scale(.75)}50%{opacity:1;transform:scale(1.1)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
</helmet>
<div style="position: relative; width: 844px; height: 390px; overflow: hidden; background: {{bg}}; font-family: 'Fredoka', ui-rounded, 'Arial Rounded MT Bold', system-ui, sans-serif; color: #2B2350">

<sc-if value="{{light}}" hint-placeholder-val="{{true}}">
<div aria-hidden="true" style="position: absolute; left: 712px; top: 18px; width: 100px; height: 100px">
<svg class="shSpin" viewBox="0 0 230 230" width="100" height="100" style="position: absolute; left: 0; top: 0">
<g fill="#FFE066">
<rect x="109" y="4" width="12" height="34" rx="6"/>
<rect x="109" y="4" width="12" height="34" rx="6" transform="rotate(45 115 115)"/>
<rect x="109" y="4" width="12" height="34" rx="6" transform="rotate(90 115 115)"/>
<rect x="109" y="4" width="12" height="34" rx="6" transform="rotate(135 115 115)"/>
<rect x="109" y="4" width="12" height="34" rx="6" transform="rotate(180 115 115)"/>
<rect x="109" y="4" width="12" height="34" rx="6" transform="rotate(225 115 115)"/>
<rect x="109" y="4" width="12" height="34" rx="6" transform="rotate(270 115 115)"/>
<rect x="109" y="4" width="12" height="34" rx="6" transform="rotate(315 115 115)"/>
</g>
</svg>
<svg viewBox="0 0 230 230" width="100" height="100" style="position: absolute; left: 0; top: 0"><circle cx="115" cy="115" r="64" fill="#FFE88A"/><circle cx="115" cy="115" r="56" fill="#FFD43B"/></svg>
</div>
</sc-if>

<sc-if value="{{dark}}" hint-placeholder-val="{{false}}">
<svg aria-hidden="true" viewBox="0 0 120 120" width="70" height="70" style="position: absolute; left: 730px; top: 26px"><defs><mask id="shMoon"><rect width="120" height="120" fill="#FFFFFF"/><circle cx="80" cy="44" r="42" fill="#000000"/></mask></defs><circle cx="56" cy="62" r="46" fill="#FFE88A" mask="url(#shMoon)"/></svg>
<svg class="shTw" aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" style="position: absolute; left: 70px; top: 40px"><path d="M12 0l3 9 9 3-9 3-3 9-3-9-9-3 9-3z" fill="#FFE066"/></svg>
<svg class="shTw" aria-hidden="true" viewBox="0 0 24 24" width="12" height="12" style="position: absolute; left: 160px; top: 150px; animation-delay: .6s"><path d="M12 0l3 9 9 3-9 3-3 9-3-9-9-3 9-3z" fill="#FFFFFF"/></svg>
<svg class="shTw" aria-hidden="true" viewBox="0 0 24 24" width="12" height="12" style="position: absolute; left: 380px; top: 30px; animation-delay: 1.1s"><path d="M12 0l3 9 9 3-9 3-3 9-3-9-9-3 9-3z" fill="#FFFFFF"/></svg>
<svg class="shTw" aria-hidden="true" viewBox="0 0 24 24" width="10" height="10" style="position: absolute; left: 640px; top: 110px; animation-delay: .3s"><path d="M12 0l3 9 9 3-9 3-3 9-3-9-9-3 9-3z" fill="#FFFFFF"/></svg>
<svg class="shTw" aria-hidden="true" viewBox="0 0 24 24" width="14" height="14" style="position: absolute; left: 790px; top: 150px; animation-delay: 1.6s"><path d="M12 0l3 9 9 3-9 3-3 9-3-9-9-3 9-3z" fill="#FFE066"/></svg>
</sc-if>

<div class="shCloud" aria-hidden="true" style="position: absolute; left: 0; top: 70px; width: 110px; height: 62px; animation-duration: 50s; animation-delay: -12s; opacity: {{cloudOp}}"><svg viewBox="0 0 160 90" width="110" height="62"><path d="M30 80C12 80 10 56 28 52C26 30 54 22 66 36C74 14 112 14 118 40C138 36 150 58 138 70C136 78 128 80 122 80Z" fill="#FFFFFF"/></svg></div>
<div class="shCloud" aria-hidden="true" style="position: absolute; left: 0; top: 20px; width: 80px; height: 45px; animation-duration: 64s; animation-delay: -40s; opacity: {{cloudOp}}"><svg viewBox="0 0 160 90" width="80" height="45"><path d="M30 80C12 80 10 56 28 52C26 30 54 22 66 36C74 14 112 14 118 40C138 36 150 58 138 70C136 78 128 80 122 80Z" fill="#FFFFFF"/></svg></div>

<svg aria-hidden="true" viewBox="0 0 1180 300" width="844" height="120" preserveAspectRatio="none" style="position: absolute; left: 0; bottom: 0">
<path d="M0 120C160 40 330 60 470 110C620 160 760 70 920 70C1040 70 1120 100 1180 120V300H0Z" fill="{{hillBack}}"/>
<path d="M0 200C140 150 300 160 440 190C600 224 760 160 920 170C1040 178 1120 200 1180 210V300H0Z" fill="{{hillFront}}"/>
</svg>

<div class="shDrop" style="position: absolute; left: 220px; top: 60px; width: 170px; height: 170px">
<img class="shBob" src="/_blob/c6f764abf556b8252c9552e7fa94a90d" alt="Moci" style="width: 170px; height: 170px">
</div>

<h1 style="position: absolute; left: 410px; top: 82px; margin: 0; display: flex; gap: 1px; font-size: 92px; font-weight: 700; line-height: 1.1; letter-spacing: 3px">
<span class="shPop" style="color: #F03E7C; text-shadow: 4px 0 0 #FFFFFF, -4px 0 0 #FFFFFF, 0 4px 0 #FFFFFF, 0 -4px 0 #FFFFFF, 3px 3px 0 #FFFFFF, -3px 3px 0 #FFFFFF, 3px -3px 0 #FFFFFF, -3px -3px 0 #FFFFFF, 0 8px 0 {{shadowCol}}">M</span>
<span class="shPop" style="color: #FF9F1C; animation-delay: .1s; text-shadow: 4px 0 0 #FFFFFF, -4px 0 0 #FFFFFF, 0 4px 0 #FFFFFF, 0 -4px 0 #FFFFFF, 3px 3px 0 #FFFFFF, -3px 3px 0 #FFFFFF, 3px -3px 0 #FFFFFF, -3px -3px 0 #FFFFFF, 0 8px 0 {{shadowCol}}">o</span>
<span class="shPop" style="color: #1C8CF0; animation-delay: .2s; text-shadow: 4px 0 0 #FFFFFF, -4px 0 0 #FFFFFF, 0 4px 0 #FFFFFF, 0 -4px 0 #FFFFFF, 3px 3px 0 #FFFFFF, -3px 3px 0 #FFFFFF, 3px -3px 0 #FFFFFF, -3px -3px 0 #FFFFFF, 0 8px 0 {{shadowCol}}">c</span>
<span class="shPop" style="color: #26A03B; animation-delay: .3s; text-shadow: 4px 0 0 #FFFFFF, -4px 0 0 #FFFFFF, 0 4px 0 #FFFFFF, 0 -4px 0 #FFFFFF, 3px 3px 0 #FFFFFF, -3px 3px 0 #FFFFFF, 3px -3px 0 #FFFFFF, -3px -3px 0 #FFFFFF, 0 8px 0 {{shadowCol}}">i</span>
</h1>

<p class="shFade" style="position: absolute; left: 416px; top: 208px; margin: 0; padding: 7px 18px 8px; border-radius: 999px; background: {{pillBg}}; box-shadow: 0 4px 0 rgba(43,35,80,.12); font-family: 'Nunito', ui-rounded, system-ui, sans-serif; font-size: 21px; font-weight: 900; color: {{pillFg}}">Main &amp; Belajar</p>

<div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 330px; display: flex; justify-content: center; gap: 12px">
<span class="shDot" style="width: 12px; height: 12px; border-radius: 50%; background: {{dot}}"></span>
<span class="shDot" style="width: 12px; height: 12px; border-radius: 50%; background: {{dot}}; animation-delay: .15s"></span>
<span class="shDot" style="width: 12px; height: 12px; border-radius: 50%; background: {{dot}}; animation-delay: .3s"></span>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tema":{"editor":"enum","options":["terang","gelap"],"default":"terang","section":"Tema"},"$preview":{"width":844,"height":390}}'>
class Component extends DCLogic {
  renderVals() {
    var dark = (this.props.tema ?? 'terang') === 'gelap';
    return {
      dark: dark,
      light: !dark,
      bg: dark ? 'linear-gradient(180deg, #15112B 0%, #2E2558 70%, #3B2F6E 100%)' : 'linear-gradient(180deg, #74C4FF 0%, #B5E2FF 60%, #DDF3FF 100%)',
      hillBack: dark ? '#3B6D55' : '#A6E38A',
      hillFront: dark ? '#2C5A44' : '#6FCF63',
      cloudOp: dark ? '.10' : '.95',
      pillBg: dark ? '#3A3170' : '#FFFFFF',
      pillFg: dark ? '#F1EDFF' : '#1B4A82',
      dot: dark ? '#FFE066' : '#FFFFFF',
      shadowCol: dark ? 'rgba(0,0,0,.35)' : 'rgba(43,35,80,.22)'
    };
  }
}
</script>
</body>
</html>
