# Manual release: bump the version, build a signed AAB/APK and an unsigned
# IPA, then publish them as a GitHub Release.
#
#   gh workflow run Release -f bump_type=patch
#
# It only runs from main through workflow_dispatch, so the `chore(release)`
# push this workflow creates does not trigger it again. Tests on main run
# first, before the version bump, so a broken commit is never released.
name: Release

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: Version bump type
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

concurrency:
  group: rilis
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  versi:
    name: Version
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    outputs:
      versi: ${{ steps.naik.outputs.versi }}
      tag: ${{ steps.naik.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.0
          channel: stable
          cache: true
      - name: Check pinned Flutter version
        run: |
          grep -q '"flutter": "3.50.0"' .fvmrc
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --exclude-tags golden
      - run: dart run tool/validate_content.dart
      - name: Bump version
        id: naik
        run: |
          set -euo pipefail
          versi="$(dart run tool/rilis/naikkan_versi.dart "${{ inputs.bump_type }}")"
          tag="v${versi%%+*}"
          echo "versi=$versi" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "$tag ($versi)"
      - name: Commit and tag
        env:
          VERSI: ${{ steps.naik.outputs.versi }}
          TAG: ${{ steps.naik.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml
          git commit -m "chore(release): $TAG"
          git tag "$TAG"
          git push origin HEAD:main
          git push origin "$TAG"

  android:
    name: Android
    needs: versi
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.versi.outputs.tag }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.0
          channel: stable
          cache: true
      - run: flutter pub get
      # Secrets are only written to $RUNNER_TEMP and android/key.properties,
      # both outside the commit and outside the artifact.
      - name: Set up release key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/moci-release.jks"
          {
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'storeFile=%s\n' "$RUNNER_TEMP/moci-release.jks"
          } > android/key.properties
      - name: Build AAB and APK
        env:
          VERSI: ${{ needs.versi.outputs.versi }}
        run: |
          set -euo pipefail
          # Leftover integration tests can register test plugins in a release build.
          rm -f android/app/src/main/java/io/flutter/plugins/GeneratedPluginRegistrant.java
          flutter build appbundle --release
          flutter build apk --release
          mkdir -p dist
          cp build/app/outputs/bundle/release/app-release.aab "dist/moci-$VERSI.aab"
          cp build/app/outputs/flutter-apk/app-release.apk "dist/moci-$VERSI.apk"
      - name: Verify the APK is release-signed
        env:
          VERSI: ${{ needs.versi.outputs.versi }}
        run: |
          set -euo pipefail
          apksigner="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          "$apksigner" verify --print-certs "dist/moci-$VERSI.apk" | tee certs.txt
          if grep -q 'Android Debug' certs.txt; then
            echo "APK is still debug-signed" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*
          if-no-files-found: error

  ios:
    name: iOS
    needs: versi
    if: github.ref_name == 'main'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.versi.outputs.tag }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.0
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build unsigned IPA
        env:
          VERSI: ${{ needs.versi.outputs.versi }}
        run: |
          set -euo pipefail
          flutter build ios --release --no-codesign
          rm -rf build/ios/ipa
          mkdir -p build/ios/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/ipa/Payload/Runner.app
          cd build/ios/ipa
          zip -qry "moci-$VERSI.ipa" Payload
          mkdir -p ../../../dist
          mv "moci-$VERSI.ipa" ../../../dist/
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: dist/*
          if-no-files-found: error

  rilis:
    name: Release
    needs: [versi, android, ios]
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          # This job does not check out the repo, so GH_REPO has to be set.
          GH_REPO: ${{ github.repository }}
          VERSI: ${{ needs.versi.outputs.versi }}
          TAG: ${{ needs.versi.outputs.tag }}
        run: |
          set -euo pipefail
          cat > catatan.md <<EOF
          Release Moci $TAG.

          - \`moci-$VERSI.apk\` for Android phones and tablets. Install it directly, and allow "install from unknown sources" when asked.
          - \`moci-$VERSI.ipa\` for iPhone and iPad. Install it through Sideloadly or AltStore with your own Apple ID.
          - \`moci-$VERSI.aab\` is for Google Play only and cannot be installed directly.

          The IPA is unsigned. With a free Apple account the app stops opening after 7 days and must be signed again; with an Apple Developer Program membership it stays valid for 1 year.
          EOF
          gh release create "$TAG" \
            "dist/moci-$VERSI.aab" \
            "dist/moci-$VERSI.apk" \
            "dist/moci-$VERSI.ipa" \
            --title "Moci $TAG" \
            --notes-file catatan.md \
            --generate-notes \
            --verify-tag
