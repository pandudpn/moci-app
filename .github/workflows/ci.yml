name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.0
          channel: stable
          cache: true
      - name: Cek versi Flutter terkunci
        run: grep -q '"flutter": "3.50.0"' .fvmrc
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test tool integration_test
      - run: flutter analyze
      - run: dart run tool/validate_content.dart
      - run: flutter test --exclude-tags golden

  golden:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.0
          channel: stable
          cache: true
      - name: Cek versi Flutter terkunci
        run: grep -q '"flutter": "3.50.0"' .fvmrc
      - run: flutter pub get
      - run: flutter test --tags golden
